name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: API safety checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synchub
          POSTGRES_PASSWORD: synchub
          POSTGRES_DB: synchub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synchub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://synchub:synchub@127.0.0.1:5432/synchub_test
      SESSION_SECRET: ci-test-session-secret
      NODE_ENV: development
      PORT: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check server import graph resolves
        run: npx tsx scripts/check-server-imports.ts

      - name: Check client import graph resolves
        run: npx tsx scripts/check-client-imports.ts

      - name: Check orphan import graph resolves
        run: npx tsx scripts/check-orphan-imports.ts

      - name: Initialize database schema
        run: npx drizzle-kit push --force

      - name: Verify CI crash detection guard
        run: npm run test:ci-crash

      - name: Run API safety tests
        env:
          BASE_URL: http://127.0.0.1:5000
          TEST_USERNAME: admin
          TEST_PASSWORD: admin123
        run: npm run test:ci

  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ steps.sha_tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export sha-based image tag
        id: sha_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

  smoke-test:
    name: Smoke-test built image
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synchub
          POSTGRES_PASSWORD: synchub
          POSTGRES_DB: synchub_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synchub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull "${{ needs.build-and-push.outputs.sha_tag }}"

      - name: Start container
        run: |
          docker run -d --name smoke \
            --network host \
            -e DATABASE_URL=postgres://synchub:synchub@127.0.0.1:5432/synchub_smoke \
            -e SESSION_SECRET=smoke-test-secret \
            -e NODE_ENV=production \
            -e PORT=5000 \
            "${{ needs.build-and-push.outputs.sha_tag }}"

      - name: Wait for /api/health to respond
        run: |
          echo "Waiting for container to become healthy..."

          # Background watchdog: if the container exits early, dump logs and kill the wait loop
          (
            while true; do
              sleep 2
              if [ "$(docker inspect --format='{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
                EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' smoke 2>/dev/null || echo "unknown")
                echo ""
                echo "Container stopped unexpectedly (exit code: ${EXIT_CODE}). Container logs:"
                docker logs smoke
                # Signal the main loop to stop by creating a sentinel file
                touch /tmp/smoke_container_died
                exit 0
              fi
            done
          ) &
          WATCHDOG_PID=$!

          FAILED=0
          for i in $(seq 1 30); do
            if [ -f /tmp/smoke_container_died ]; then
              echo "Aborting health-check loop — container is no longer running."
              FAILED=1
              break
            fi
            if curl -sf http://127.0.0.1:5000/api/health; then
              echo ""
              echo "Health check passed on attempt $i"
              kill "$WATCHDOG_PID" 2>/dev/null || true
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet, retrying in 2s..."
            sleep 2
          done

          kill "$WATCHDOG_PID" 2>/dev/null || true

          if [ "$FAILED" -eq 0 ]; then
            EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' smoke 2>/dev/null || echo "unknown")
            echo "Health check failed after 60s (container exit code: ${EXIT_CODE}). Container logs:"
            docker logs smoke
          fi
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL not set — skipping deploy webhook"
            exit 0
          fi
          curl --silent --fail --show-error \
            -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json"
          echo "Coolify deploy triggered"
