name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: API safety checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synchub
          POSTGRES_PASSWORD: synchub
          POSTGRES_DB: synchub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synchub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://synchub:synchub@127.0.0.1:5432/synchub_test
      SESSION_SECRET: ci-test-session-secret
      NODE_ENV: development
      PORT: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check server import graph resolves
        run: npx tsx scripts/check-server-imports.ts

      - name: Check client import graph resolves
        run: npx tsx scripts/check-client-imports.ts

      - name: Check orphan import graph resolves
        run: npx tsx scripts/check-orphan-imports.ts

      - name: Initialize database schema
        run: npx drizzle-kit push --force

      - name: Start application
        run: |
          npm run dev > server.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time" >&2
          cat server.log >&2 || true
          exit 1

      - name: Run API safety tests
        env:
          BASE_URL: http://127.0.0.1:5000
          TEST_USERNAME: admin
          TEST_PASSWORD: admin123
        run: npx tsx --test tests/api/*.test.ts

      - name: Dump server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop application
        if: always()
        run: kill "$APP_PID" || true

  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL not set — skipping deploy webhook"
            exit 0
          fi
          curl --silent --fail --show-error \
            -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json"
          echo "Coolify deploy triggered"
