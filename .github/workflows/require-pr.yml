name: Require PR for main

on:
  push:
    branches:
      - main

jobs:
  direct-push-guard:
    name: Block direct push to main
    runs-on: ubuntu-latest
    steps:
      - name: Verify this commit arrived via a merged Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          echo "Checking whether commit ${COMMIT_SHA} was merged via a PR..."

          PR_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
            --jq 'length')

          if [ "${PR_COUNT}" -eq 0 ]; then
            echo ""
            echo "⛔  Direct push to main detected."
            echo ""
            echo "Changes must reach main through a Pull Request so that:"
            echo "  • the 'API safety checks' CI job runs and is reviewable"
            echo "  • at least one team member can review the diff"
            echo ""
            echo "To enforce this at the git level (and skip this check),"
            echo "enable branch protection rules under:"
            echo "  Settings → Branches → Add branch protection rule"
            echo "  (requires GitHub Pro for private repositories)"
            echo ""
            exit 1
          fi

          echo "✅  Commit ${COMMIT_SHA} was introduced via Pull Request — proceeding."
